<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewa Management Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 pb-24">
    <div class="bg-blue-800 p-4 sticky top-0 z-50 shadow-xl">
        <input type="text" id="srch" onkeyup="render()" placeholder="नाम या मोबाइल से सर्च..." class="w-full p-3 rounded-xl outline-none shadow-inner mb-3">
        <div class="flex justify-around text-white font-bold text-sm">
            <button onclick="setTab('All')" id="tAll" class="border-b-4 border-white pb-1">All List</button>
            <button onclick="setTab('Active')" id="tActive" class="opacity-60">Active</button>
            <button onclick="setTab('Inactive')" id="tInactive" class="opacity-60">Inactive</button>
        </div>
    </div>

    <div id="list" class="p-4 space-y-3"></div>

    <button onclick="showModal('regMod')" class="fixed bottom-6 right-6 bg-blue-600 text-white w-16 h-16 rounded-full shadow-2xl text-4xl">+</button>

    <div id="profMod" class="fixed inset-0 bg-black/80 hidden z-[60] p-4 flex items-center justify-center">
        <div class="bg-white rounded-3xl w-full max-w-md h-[85vh] overflow-y-auto p-6 relative">
            <button onclick="hideModal('profMod')" class="absolute top-4 right-4 text-3xl font-light">&times;</button>
            <div id="profData"></div>
            <hr class="my-6">
            <h3 class="font-bold text-blue-700 mb-3">Add Shift / Sewa Points</h3>
            <div class="space-y-3">
                <select id="sTime" class="w-full p-3 border rounded-xl bg-gray-50"></select>
                <select id="sType" class="w-full p-3 border rounded-xl bg-gray-50"></select>
                <input type="number" id="sPts" placeholder="पॉइंट्स (जैसे 1 या 2)" class="w-full p-3 border rounded-xl">
                <button id="addSwaBtn" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">Record Sewa</button>
            </div>
            <div id="swaHist" class="mt-6 text-sm"></div>
        </div>
    </div>

    <div id="regMod" class="fixed inset-0 bg-black/80 hidden z-[60] p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl w-full max-w-md mx-auto my-5 p-6 shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-center text-blue-800">Registration</h2>
            <form id="mainForm" onsubmit="handleSave(event)" class="space-y-3 text-sm">
                <input type="file" id="pic" accept="image/*" class="w-full border p-2 rounded-xl">
                <input type="text" id="name" placeholder="नाम" required class="w-full p-3 border rounded-xl">
                <div class="flex gap-2">
                    <select id="rel" class="w-1/3 p-3 border rounded-xl"></select>
                    <input type="text" id="guard" placeholder="अभिभावक का नाम" required class="w-2/3 p-3 border rounded-xl">
                </div>
                <input type="number" id="mob" placeholder="मोबाइल (10 अंक)" required class="w-full p-3 border rounded-xl">
                <div class="flex gap-2">
                    <input type="number" id="age" placeholder="उम्र" class="w-1/2 p-3 border rounded-xl">
                    <select id="stat" class="w-1/2 p-3 border rounded-xl"><option>Active</option><option>Inactive</option></select>
                </div>
                <select id="teh" class="w-full p-3 border rounded-xl"></select>
                <select id="man" class="w-full p-3 border rounded-xl"></select>
                <select id="occ" class="w-full p-3 border rounded-xl"></select>
                <textarea id="addr" placeholder="पूरा पता" class="w-full p-3 border rounded-xl h-16"></textarea>
                <button type="submit" id="saveBtn" class="w-full bg-blue-700 text-white py-4 rounded-xl font-bold">SUBMIT DATA</button>
                <button type="button" onclick="hideModal('regMod')" class="w-full py-2 text-gray-400">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbz7wTGyCYDUiqQonJbt8Eab3OBJFQK-zF9V96X_RQcjm_XhjAAvft3AIzdDyOi8gDjO/exec";
        let db = [], drops = [], logs = [], activeTab = 'All';

        async function init() {
            try {
                const r = await fetch(API);
                const d = await r.json();
                db = d.users.slice(1);
                logs = d.logs.slice(1);
                drops = d.drops;
                
                const fill = (id, col) => {
                    const list = d.drops.slice(1).map(row => row[col-1]).filter(String);
                    document.getElementById(id).innerHTML = list.map(i => `<option value="${i}">${i}</option>`).join('');
                };
                fill('rel', 1); fill('teh', 2); fill('man', 3); fill('occ', 4);
                fill('sType', 5); fill('sTime', 6);
                render();
            } catch(e) { alert("Data Load Failed!"); }
        }

        function render() {
            const term = document.getElementById('srch').value.toLowerCase();
            let data = db;
            if(activeTab !== 'All') data = db.filter(u => u[11] === activeTab);
            if(term) data = data.filter(u => u[3].toLowerCase().includes(term) || u[6].toString().includes(term));

            document.getElementById('list').innerHTML = data.map(u => `
                <div onclick="openProfile('${u[0]}')" class="bg-white p-4 rounded-2xl shadow-sm border flex items-center gap-4 active:scale-95 transition">
                    <img src="${u[2]}" class="w-14 h-14 rounded-full object-cover bg-gray-200">
                    <div class="flex-1">
                        <h4 class="font-bold">${u[3]}</h4>
                        <p class="text-xs text-gray-500">${u[6]} | ${u[8]}</p>
                    </div>
                    <div class="text-center bg-blue-50 px-3 py-1 rounded-lg">
                        <p class="text-[10px] font-bold text-blue-400 uppercase">Total</p>
                        <p class="font-black text-blue-700 text-lg">${u[13] || 0}</p>
                    </div>
                </div>
            `).join('');
        }

        function openProfile(id) {
            const u = db.find(x => x[0] == id);
            const history = logs.filter(l => l[1] == id);
            document.getElementById('profData').innerHTML = `
                <img src="${u[2]}" class="w-24 h-24 mx-auto rounded-full object-cover mb-4 border-4 border-blue-50">
                <h2 class="text-2xl font-black text-center">${u[3]}</h2>
                <p class="text-center font-bold text-green-600 mb-6">${u[11]}</p>
                <div class="text-sm space-y-2 bg-slate-50 p-4 rounded-2xl">
                    <p><b>Guardian:</b> ${u[4]} ${u[5]}</p>
                    <p><b>Mobile:</b> ${u[6]}</p>
                    <p><b>Age:</b> ${u[7]} | <b>Tehsil:</b> ${u[8]}</p>
                    <p><b>Address:</b> ${u[12]}</p>
                </div>
                <div class="flex gap-2 mt-4">
                    <button onclick="handleDelete('${u[0]}')" class="flex-1 bg-red-50 text-red-600 p-2 rounded-xl text-xs font-bold">DELETE</button>
                    <button onclick="handleEdit('${u[0]}')" class="flex-1 bg-blue-50 text-blue-600 p-2 rounded-xl text-xs font-bold">EDIT</button>
                </div>
            `;
            document.getElementById('swaHist').innerHTML = `<b>Sewa History:</b>` + history.map(h => `
                <div class="flex justify-between text-[11px] border-b py-2 text-gray-500">
                    <span>${new Date(h[3]).toLocaleDateString()} | ${h[4]}</span>
                    <span class="font-bold text-blue-800">${h[5]} (+${h[6]} Pts)</span>
                </div>
            `).join('');
            document.getElementById('addSwaBtn').onclick = () => addSewa(u[0], u[3]);
            showModal('profMod');
        }

        async function handleSave(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "Processing...";
            
            const file = document.getElementById('pic').files[0];
            let imgBase64 = "";
            if(file) imgBase64 = await compressImg(file);

            const payload = {
                action: "save",
                img: imgBase64,
                name: document.getElementById('name').value,
                rel: document.getElementById('rel').value,
                guard: document.getElementById('guard').value,
                mob: document.getElementById('mob').value,
                age: document.getElementById('age').value,
                status: document.getElementById('stat').value,
                tehsil: document.getElementById('teh').value,
                mantra: document.getElementById('man').value,
                occ: document.getElementById('occ').value,
                addr: document.getElementById('addr').value
            };
            const r = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            if(await r.text() === "Success") location.reload();
        }

        async function addSewa(pid, pname) {
            const payload = {
                action: "addSewa", pid, pname,
                shift: document.getElementById('sTime').value,
                stype: document.getElementById('sType').value,
                pts: document.getElementById('sPts').value || 1
            };
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            alert("Sewa Recorded!"); location.reload();
        }

        function compressImg(file) {
            return new Promise(res => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = e => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 300; canvas.height = 300;
                        ctx.drawImage(img, 0, 0, 300, 300);
                        res(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        function setTab(t) {
            activeTab = t;
            ['All', 'Active', 'Inactive'].forEach(x => {
                document.getElementById('t'+x).className = (x===t) ? 'border-b-4 border-white pb-1' : 'opacity-60';
            });
            render();
        }

        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function hideModal(id) { document.getElementById(id).classList.add('hidden'); }
        init();
    </script>
</body>
</html>
