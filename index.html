<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewa Management Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 pb-20">

    <div class="bg-blue-700 p-4 sticky top-0 z-40 shadow-md">
        <h1 class="text-white text-center font-bold text-lg mb-3">Sewa Management System</h1>
        <input type="text" id="search" onkeyup="filterData()" placeholder="नाम या मोबाइल से सर्च करें..." class="w-full p-2 rounded-lg outline-none shadow-inner">
    </div>

    <div class="flex justify-around bg-white border-b sticky top-[108px] z-40">
        <button onclick="changeTab('All')" id="tabAll" class="py-3 px-4 border-b-4 border-blue-600 text-blue-600 font-bold">All List</button>
        <button onclick="changeTab('Active')" id="tabActive" class="py-3 px-4 border-b-4 border-transparent">Active</button>
        <button onclick="changeTab('Inactive')" id="tabInactive" class="py-3 px-4 border-b-4 border-transparent">Inactive</button>
    </div>

    <div id="listContainer" class="p-4 space-y-3">
        <p class="text-center text-gray-500 mt-10">डाटा लोड हो रहा है...</p>
    </div>

    <button onclick="openRegisterForm()" class="fixed bottom-6 right-6 bg-blue-600 text-white w-14 h-14 rounded-full shadow-2xl text-3xl font-bold flex items-center justify-center">+</button>

    <div id="profileModal" class="fixed inset-0 bg-black/50 hidden z-50 p-4">
        <div class="bg-white rounded-2xl w-full max-w-md mx-auto mt-10 p-6 overflow-y-auto max-h-[80vh] relative">
            <button onclick="closeProfile()" class="absolute top-4 right-4 text-2xl">×</button>
            <div id="profileContent"></div>
        </div>
    </div>

    <div id="regModal" class="fixed inset-0 bg-black/50 hidden z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl w-full max-w-md mx-auto my-5 p-6 relative shadow-2xl">
            <h2 class="text-xl font-bold mb-4 border-b pb-2 text-blue-700 text-center">Register</h2>
            <form id="entryForm" onsubmit="saveData(event)">
                <div class="space-y-3 text-sm">
                    <div>
                        <div>
    <label class="font-bold">Photo *</label>
    <input type="file" id="photoInput" accept="image/*" required class="w-full border p-2 rounded bg-white">
</div>
                    </div>
                    <div>
                        <label class="font-bold">Name *</label>
                        <input type="text" id="name" placeholder="Enter Name" required class="w-full border p-2 rounded">
                    </div>
                    <div class="flex gap-2">
                        <div class="w-1/3">
                            <label class="font-bold">Relation *</label>
                            <select id="relation" required class="w-full border p-2 rounded">
                                <option value="S/O">S/O</option>
                                <option value="D/O">D/O</option>
                                <option value="W/O">W/O</option>
                            </select>
                        </div>
                        <div class="w-2/3">
                            <label class="font-bold">Guardian's Name *</label>
                            <input type="text" id="guardian" placeholder="Guardian Name" required class="w-full border p-2 rounded">
                        </div>
                    </div>
                    <div>
                        <label class="font-bold text-red-600">Mobile Number (10 Digits) *</label>
                        <input type="text" id="mobile" placeholder="98XXXXXXXX" maxlength="10" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full border p-2 rounded">
                    </div>
                    <div class="flex gap-2">
                        <div class="w-1/2">
                            <label class="font-bold">Age *</label>
                            <input type="number" id="age" placeholder="Age" required class="w-full border p-2 rounded">
                        </div>
                        <div class="w-1/2">
                            <label class="font-bold">Status *</label>
                            <select id="status" class="w-full border p-2 rounded">
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="font-bold">Tehsil *</label>
                        <select id="tehsil" required class="w-full border p-2 rounded">
                            <option value="Tehsil 1">Tehsil 1</option>
                        </select>
                    </div>
                    <div>
                        <label class="font-bold">Mantra *</label>
                        <select id="mantra" required class="w-full border p-2 rounded">
                            <option value="Mantra 1">Mantra 1</option>
                        </select>
                    </div>
                    <div>
                        <label class="font-bold">Occupation *</label>
                        <select id="occupation" required class="w-full border p-2 rounded">
                            <option value="Farmer">Farmer</option>
                        </select>
                    </div>
                    <div>
                        <label class="font-bold text-gray-400">Address (Optional)</label>
                        <textarea id="address" placeholder="Complete Address" class="w-full border p-2 rounded h-16"></textarea>
                    </div>
                </div>
                <div class="flex gap-2 mt-6">
                    <button type="button" onclick="closeRegisterForm()" class="flex-1 bg-gray-200 py-3 rounded-lg font-bold">Cancel</button>
                    <button type="submit" id="submitBtn" class="flex-1 bg-black text-white py-3 rounded-lg font-bold">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- 2. यहाँ अपनी WEB APP URL डालें ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyA2PDMQEKant-o40h7eg90jNk8BTxKY4ezQle8rnZzxCLbBHEziOjzjAa0xXTzu-5v/exec"; 

        let rawData = [];
        let currentTab = 'All';

        async function loadData() {
        try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        // 1. डेटा को सही जगह सेट करें
        rawData = data.users.slice(1); 
        
        // 2. ड्रॉपडाउन भरें
        fillDropdown('tehsil', data.tehsils || []);
        fillDropdown('mantra', data.mantras || []);
        fillDropdown('occupation', data.occupations || []);
        
        filterData();
        } catch (e) {
        console.error("Loading Error:", e);
        document.getElementById('listContainer').innerHTML = "डाटा लोड करने में समस्या: " + e.message;
        }
        }
        
        function fillDropdown(id, list) {
        const select = document.getElementById(id);
        select.innerHTML = '<option value="">Select Option</option>' + 
        list.map(item => `<option value="${item}">${item}</option>`).join('');
        }
        

        function renderList(items) {
            const container = document.getElementById('listContainer');
            if(items.length === 0) { container.innerHTML = "कोई डाटा नहीं मिला।"; return; }
            container.innerHTML = items.map(row => `
                <div onclick="showProfile('${row[0]}')" class="bg-white p-3 rounded-xl shadow-sm border flex items-center gap-4 active:scale-95 transition cursor-pointer">
                    <img src="${row[2] || 'https://via.placeholder.com/150'}" class="w-14 h-14 rounded-full object-cover bg-gray-200 shadow-inner">
                    <div class="flex-1">
                        <h4 class="font-bold text-gray-800">${row[3]}</h4>
                        <p class="text-sm text-gray-500">${row[6]}</p>
                    </div>
                    <span class="text-[10px] px-2 py-1 rounded-full font-bold ${row[11] === 'Active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${row[11]}</span>
                </div>
            `).join('');
        }

        function filterData() {
            const term = document.getElementById('search').value.toLowerCase();
            let filtered = rawData;
            if (currentTab !== 'All') filtered = filtered.filter(r => r[11] === currentTab);
            if (term) filtered = filtered.filter(r => r[3].toLowerCase().includes(term) || r[6].toString().includes(term));
            renderList(filtered);
        }

        function changeTab(tab) {
            currentTab = tab;
            ['All', 'Active', 'Inactive'].forEach(t => {
                const el = document.getElementById('tab' + t);
                el.className = `py-3 px-4 border-b-4 ${t === tab ? 'border-blue-600 text-blue-600 font-bold' : 'border-transparent'}`;
            });
            filterData();
        }

        function openRegisterForm() { document.getElementById('regModal').classList.remove('hidden'); }
        function closeRegisterForm() { document.getElementById('regModal').classList.add('hidden'); }
        function closeProfile() { document.getElementById('profileModal').classList.add('hidden'); }

        function showProfile(id) {
            const person = rawData.find(r => r[0] == id);
            const content = document.getElementById('profileContent');
            content.innerHTML = `
                <img src="${person[2]}" class="w-24 h-24 mx-auto rounded-full border-4 border-blue-100 mb-4 shadow-md object-cover">
                <h2 class="text-2xl font-bold text-center mb-1">${person[3]}</h2>
                <p class="text-center font-bold mb-4 ${person[11] === 'Active' ? 'text-green-600' : 'text-red-600'}">${person[11]}</p>
                <div class="space-y-2 text-sm border-t pt-4">
                    <p><b>Guardian:</b> ${person[4]} ${person[5]}</p>
                    <p><b>Mobile:</b> ${person[6]}</p>
                    <p><b>Age:</b> ${person[7]}</p>
                    <p><b>Address:</b> ${person[12]}</p>
                    <div class="bg-blue-50 p-3 rounded-lg mt-4 text-center">
                        <p class="text-xs text-blue-400 font-bold uppercase">Total Sewa</p>
                        <p class="text-3xl font-black text-blue-700">${person[13] || 0}</p>
                    </div>
                </div>
                <div class="flex gap-2 mt-6">
                    <button class="flex-1 bg-gray-100 py-2 rounded-lg font-bold text-blue-600 border border-blue-200">Edit</button>
                    <button onclick="deleteEntry('${person[0]}')" class="flex-1 bg-red-50 py-2 rounded-lg font-bold text-red-600 border border-red-200">Delete</button>
                </div>
            `;
            document.getElementById('profileModal').classList.remove('hidden');
        }

        async function saveData(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "Saving...";

            const photoFile = document.getElementById('photoInput').files[0];
            const reader = new FileReader();
            reader.readAsDataURL(photoFile);
            reader.onload = async () => {
                const payload = {
                    action: 'save',
                    name: document.getElementById('name').value,
                    relation: document.getElementById('relation').value,
                    guardian: document.getElementById('guardian').value,
                    mobile: document.getElementById('mobile').value,
                    age: document.getElementById('age').value,
                    status: document.getElementById('status').value,
                    tehsil: document.getElementById('tehsil').value,
                    mantra: document.getElementById('mantra').value,
                    occupation: document.getElementById('occupation').value,
                    address: document.getElementById('address').value,
                    image: reader.result
                };

                await fetch(SCRIPT_URL + "?action=save", { method: 'POST', body: JSON.stringify(payload) });
                alert("डाटा सेव हो गया!");
                location.reload();
            };
        }

        loadData();
    </script>
</body>
</html>
